# ---------------------------------------------------------------------------------------------
# INSTRUCTIONS
# ---------------------------------------------------------------------------------------------
# STEP 1 -- from the MISSION ROOT (not the worktree: the wrapper resolves the mission root as its own
#           script directory's parent, so the copy inside a worktree would gate and commit against the
#           worktree), run exactly:
#             powershell -NoProfile -ExecutionPolicy Bypass -File tools\mission-ceremony-record.ps1 -CeremonyId ledger-ceremony-smoke-001
#           Expect exit 0, both clean-tree gates reported passing, the ledger append and an atomic
#           commit. The ceremony id is fixed: ledger ids are one per event and fail closed on a
#           duplicate.
# STEP 2 -- if and only if STEP 1 exited 0, read back the commit the ceremony made
#           (git log -1 --format=%H at the mission root).
# STEP 3 -- write the handoff to LAM_HANDOFF with that commit in `commits`. If the ceremony did not
#           exit 0, say so in issues_observed, leave commits empty and do not report completed.
#           No runner_anchors.
