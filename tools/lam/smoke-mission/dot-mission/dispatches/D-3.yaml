# Worker Dispatch -- CLOSE (ceremony-class). THIS ARTIFACT IS THE WORK'S ENTIRE INPUT.
# A ceremony-class operation runs as a dispatch so that the session it runs in is a runner-owned
# evidence session: its own captured calls name the ceremony, and its prompt is a worker's, never an
# operator's.
# Performed by build-smoke-mission.ps1, not by a CLI worker.

